<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weekly Challenge — Pumping Iron</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0A0A0A;
            color: #E5E5E5;
            font-family: system-ui, sans-serif;
            min-height: 100vh;
        }
        nav {
            background: #000;
            border-bottom: 1px solid #333;
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-brand {
            font-size: 1.4rem;
            font-weight: bold;
            color: #EF4444;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 1rem;
        }
        button {
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: #1F1F1F;
            border: none;
            color: #AAA;
        }
        .tab-btn.active {
            background: #F59E0B;
            color: #111;
        }
        .card {
            background: #1F1F1F;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <nav>
        <div style="display:flex; justify-content:space-between; align-items:center; max-width:480px; margin:0 auto;">
            <span class="nav-brand">PUMPING IRON</span>
            <div style="display:flex; gap:1rem;">
                <a href="index.html" style="color:#AAA; text-decoration:none;">Home</a>
                <a href="index.html#calculator" style="color:#AAA; text-decoration:none;">GET MY DOSE</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 style="font-size:1.8rem; margin:1.5rem 0 0.5rem;">Weekly Challenge</h1>
        <p style="color:#888; margin-bottom:1.5rem;">Entry KSh 125 • Real athletes only</p>

        <div style="display:flex; gap:8px; margin-bottom:20px;">
            <button onclick="switchTab(0)" class="tab-btn active" id="tab0">Register</button>
            <button onclick="switchTab(1)" class="tab-btn" id="tab1">Leaderboard</button>
        </div>

        <!-- Register Tab -->
        <div id="registerTab">
            <div class="card">
                <h3 style="margin-bottom:12px;">Enter this week's challenge</h3>
                <input type="text" id="name" placeholder="Full Name" />
                <input type="tel" id="phone" placeholder="Phone Number (M-Pesa)" />
                <input type="number" id="weight" placeholder="Weight in kg" />
                <button onclick="register()" style="background:#F59E0B; color:#111; width:100%;">Register — KSh 125</button>
            </div>
        </div>

        <!-- Leaderboard Tab -->
        <div id="leaderboardTab" style="display:none;">
            <div class="card">
                <h3>Leaderboard</h3>
                <p id="lbContent" style="color:#888; padding:20px; text-align:center;">No results yet</p>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 0;

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('registerTab').style.display = tab === 0 ? 'block' : 'none';
            document.getElementById('leaderboardTab').style.display = tab === 1 ? 'block' : 'none';

            document.getElementById('tab0').classList.toggle('active', tab === 0);
            document.getElementById('tab1').classList.toggle('active', tab === 1);
        }

        function register() {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const weight = document.getElementById('weight').value.trim();

            if (!name || !phone || !weight) {
                alert("Please fill all fields");
                return;
            }

            alert(`✅ Registration successful!\n\nName: ${name}\nPhone: ${phone}\nWeight: ${weight}kg`);
            // You can add Supabase or local storage logic here later
        }

        // Initialize
        window.onload = () => {
            switchTab(0);
            lucide.createIcons();
        };
    </script>
</body>
</html>
